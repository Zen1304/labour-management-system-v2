services:
  - type: web
    name: labour-management-system-rebuild
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: NODE_VERSION
        value: 22.13.0
